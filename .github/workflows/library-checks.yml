name: Library checks

on:
  pull_request:
    paths:
      - '.github/vendor-libraries.json'
      - '.github/workflows/library-*.yml'
      - 'scripts/update_libraries.py'
      - 'tests/test_update_libraries.py'
      - 'vaarattu-unit-frames/Libraries/oUF/**'
  push:
    branches: [main]
    paths:
      - '.github/vendor-libraries.json'
      - '.github/workflows/library-*.yml'
      - 'scripts/update_libraries.py'
      - 'tests/test_update_libraries.py'
      - 'vaarattu-unit-frames/Libraries/oUF/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1
      - run: python -B -m unittest discover -s tests -p 'test_update_libraries.py'
      - run: python -B scripts/update_libraries.py --luac luac5.1
